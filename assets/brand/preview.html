<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Miu logo</title>
<style>body{margin:0;font:13px -apple-system,system-ui;background:#0d0d0d;color:#8a8a8a;padding:32px 16px}main{max-width:1000px;margin:auto;display:grid;gap:14px}
h2{font-size:13px;font-weight:500;margin:16px 0 -4px;color:#bbb}p{margin:0 0 4px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row{display:flex;gap:28px;align-items:center;justify-content:center;padding:32px 20px;border-radius:14px;min-height:110px}.d{background:#171717}.l{background:#fafafa}
@media (max-width:700px){.pair{grid-template-columns:1fr}}</style>
<main>
<h2>Icon + text</h2><div class="pair"><div class="row l"><img src="miu-logo-black.svg" height="56" alt="Miu logo"></div><div class="row d"><img src="miu-logo-white.svg" height="56" alt=""></div></div>
<h2>Icon + text, large icon</h2><div class="pair"><div class="row l"><img src="miu-logo-big-black.svg" height="72" alt="Miu logo with a large icon"></div><div class="row d"><img src="miu-logo-big-white.svg" height="72" alt=""></div></div>
<h2>Icon + "miu."</h2><div class="pair"><div class="row l"><img src="miu-logo-dot-black.svg" height="56" alt="Miu logo with full stop"></div><div class="row d"><img src="miu-logo-dot-white.svg" height="56" alt=""></div></div>
<h2>Stacked</h2><div class="pair"><div class="row l"><img src="miu-logo-stacked-black.svg" height="110" alt="Miu stacked logo"></div><div class="row d"><img src="miu-logo-stacked-white.svg" height="110" alt=""></div></div>
<h2>Text only (the dot on the i is always the cat)</h2><div class="pair"><div class="row l"><img src="miu-wordmark-black.svg" height="48" alt="miu"></div><div class="row d"><img src="miu-wordmark-white.svg" height="48" alt=""></div></div>
<h2>"miu."</h2><div class="pair"><div class="row l"><img src="miu-wordmark-dot-black.svg" height="48" alt="miu."></div><div class="row d"><img src="miu-wordmark-dot-white.svg" height="48" alt=""></div></div>
<h2>Icon + name in dots, cat on the i</h2><div class="pair"><div class="row l"><img src="miu-logo-dots-black.svg" height="96" alt="Miu logo in dots"></div><div class="row d"><img src="miu-logo-dots-white.svg" height="96" alt=""></div></div>
<h2>Icon + name, solid pixels, cat on the i</h2><div class="pair"><div class="row l"><img src="miu-logo-pixel-black.svg" height="96" alt="Miu logo in solid pixels"></div><div class="row d"><img src="miu-logo-pixel-white.svg" height="96" alt=""></div></div>
<h2>Icon in dots</h2><div class="pair"><div class="row l"><img src="miu-mark-dots-black.svg" height="96" alt="Miu cat in dots"><img src="miu-mark-dots-black.svg" height="48" alt=""><img src="miu-mark-dots-black.svg" height="24" alt=""></div><div class="row d"><img src="miu-mark-dots-white.svg" height="96" alt=""><img src="miu-mark-dots-white.svg" height="48" alt=""><img src="miu-mark-dots-white.svg" height="24" alt=""></div></div>
<h2>Icon (as before)</h2><div class="pair"><div class="row l"><img src="miu-mark-black.svg" height="80" alt="Miu icon"></div><div class="row d"><img src="miu-mark-white.svg" height="80" alt=""></div></div>
</main></html>
