/* Codex desktop look: dark, quiet, black and white; colour only for results. */
:root {

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--main); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }

.skel { padding: 28px 32px; display: grid; gap: 14px; max-width: 920px; }

.wrap { max-width: 1080px; margin: 0 auto; padding: 22px 28px 60px; }

.swrap { max-width: 860px; }
.snav { display: none; }
.shtitle { font-size: 18px; font-weight: 600; letter-spacing: -.01em; padding: 6px 10px 10px; }

}

.conn .dot.ok { background: var(--ok); } .conn .dot.bad { background: var(--bad); }

.snote .ico { width: 14px; height: 14px; flex-shrink: 0; margin-top: 2px; }

.itab:hover { color: var(--ink); }

/* run view */

/* The bar between what the agent did and the result: drag it, or focus it and

.splitter { cursor: col-resize; position: relative; background: transparent; outline: none; touch-action: none; }
.splitter::before { content: ""; position: absolute; top: 0; bottom: 0; left: 3px; width: 1px; background: var(--line); transition: background .15s, width .15s, left .15s; }
.splitter:hover::before, .splitter:focus-visible::before, .work.resizing .splitter::before { left: 2px; width: 3px; background: var(--muted); }
.work.resizing { cursor: col-resize; user-select: none; }
.work.resizing img { pointer-events: none; }
.work.nopanel .panel { display: none; }

.cmd > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 8px; padding: 4px 6px; border-radius: 6px; font-size: 13px; align-items: baseline; color: var(--ink2); }

pre { font-family: var(--mono); font-size: 12px; line-height: 1.5; background: #121212; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 6px 0 10px; white-space: pre-wrap; word-break: break-word; max-height: 340px; overflow: auto; color: var(--ink2); }
/* the task the agent was given, phase headers, before/after */

.task-msg .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; }

.steer-msg .who { font-size: 12px; color: var(--muted); margin-bottom: 3px; }

.phase::after { content: ""; flex: 1; height: 1px; background: var(--line2); }
.tool .mcp { color: var(--accent); font-weight: 600; }
.tool .args { font-family: var(--mono); font-size: 12px; color: var(--ink2); white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
.ba { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 4px; }
.ba .side { border: 1px solid var(--line2); border-radius: 10px; padding: 10px 12px; background: var(--raise); }
.ba .side h4 { margin: 0 0 4px; font-size: 12.5px; font-weight: 600; color: var(--muted); display: flex; gap: 8px; align-items: center; }

/* ---------- GitHub-style filters, kept in the URL ---------- */
// ?q=&author=a,b&label=x&result=partial&sort=newest&tab=tested&repo=<repo name>
// The URL is the source of truth, so a link opens the same filtered list.
const FILTERS = ['author', 'label', 'result', 'sort'];
const RESULTS = { ok: 'Found OK', partial: 'Found partially OK', not_ok: 'Found NOT OK', bugs: 'Reported bugs (label)', inconclusive: 'No result', already_fixed: 'Already fixed on dev', none: 'Not tested yet' };
const SORTS = { updated: 'Recently updated', newest: 'Newest', oldest: 'Oldest', tested: 'Recently tested', number: 'PR number' };
const TABS = ['all', 'todo', 'active', 'tested', 'conflict'];
function readUrl() {
  const u = new URLSearchParams(location.search), list = (k) => (u.get(k) || '').split(',').map((x) => x.trim()).filter(Boolean);
  const f = { q: u.get('q') || '', author: list('author'), label: list('label'), result: list('result').filter((x) => RESULTS[x]), sort: SORTS[u.get('sort')] ? u.get('sort') : 'updated' };
  if (u.has('tab') && TABS.includes(u.get('tab'))) ui.filter = u.get('tab');
  if (u.has('repo')) ui.repo = MIU.repos.some((r) => r.name === u.get('repo')) ? u.get('repo') : '';
  return f;
}
function writeUrl() {
  const u = new URLSearchParams();
  if (ui.f.q) u.set('q', ui.f.q);
  for (const k of ['author', 'label', 'result']) if (ui.f[k].length) u.set(k, ui.f[k].join(','));
  if (ui.f.sort !== 'updated') u.set('sort', ui.f.sort);
  if (ui.filter !== 'all') u.set('tab', ui.filter);
  if (ui.repo) u.set('repo', ui.repo);
  const qs = u.toString().replace(/%2C/g, ',').replace(/%3A/g, ':');

const filtersOn = () => !!(ui.f.q || ui.f.author.length || ui.f.label.length || ui.f.result.length);

}
// repo:<name>, repo:<label> or repo:<role> in the search box.
const REPO_ALIAS = Object.fromEntries(MIU.repos.flatMap((r) => [[r.name, r.name], [String(r.label).toLowerCase(), r.name], [r.role, r.name]]));

    if (/^build (.+): FAILED/.test(txt)) return 'Build of ' + txt.match(/^build (.+): FAILED/)[1] + ' failed';
    if (/^wp env: up/.test(txt)) return 'Started a fresh WordPress test site';
    if (/^rexenv: stack up/.test(txt)) return 'Checked rexenv' + (/redis on/.test(txt) ? ' and started Redis' : '');
    if (/^rexenv env: FAILED/.test(txt)) return 'rexenv is not ready: ' + txt.replace('rexenv env: FAILED ', '');
    if (/^rexenv: deleted /.test(txt)) return 'Deleted the scratch site ' + txt.replace('rexenv: deleted ', '');
    if (/^hub env: up/.test(txt)) return 'Started a fresh Hub';
    if (/^check (.+): running on dev/.test(txt)) return 'Running ' + txt.match(/^check (.+): running/)[1] + ' on dev to compare';
    if (/^check (.+): running/.test(txt)) return 'Running ' + txt.match(/^check (.+): running/)[1];
    if (/^check /.test(txt)) return txt.replace(/^check /, '').replace(/:/, ':');
    if (/^checks finished/.test(txt)) return 'Repo test suites finished';
    if (/^model switched/.test(txt)) return 'Model changed: ' + txt.replace('model switched ', '').split(' -> ').map(shortModel).join(' to ');
    if (/^verdict /.test(txt)) return null;
    return txt;
  };
  return (d.log || '').split('\n').map((l) => l.match(/^\[qa (\d\d:\d\d:\d\d)\] (.*)$/)).filter(Boolean).map((m) => {
    const text = label(m[2]);
    return text ? { kind: 'setup', text, at: day + 'T' + m[1] + 'Z', bad: /FAILED|failed|did not start/.test(m[2]) } : null;
  }).filter(Boolean);
}

function conversation(d) {
  const pr = d.pr || {}, q = ui.q.toLowerCase(), full = ui.view !== 'compact';
  const running = d.status.state === 'running';
  const out = ['<div class="convohead"><input class="tlsearch" type="search" data-q placeholder="Search what happened" value="' + esc(ui.q) + '"><span class="viewsw"><button data-view="full"' + (full ? ' class="on"' : '') + '>Full</button><button data-view="compact"' + (!full ? ' class="on"' : '') + '>Compact</button></span></div>'];
  // What the agent was told: the run-specific part in view, the standing
  // instructions one click away.
  if (d.prompt && !q) {
    const cut = d.prompt.lastIndexOf('\n---\n');
    const ask = cut > -1 ? d.prompt.slice(cut + 5).trim() : '';
    out.push('<div class="task-msg"><div class="who">Task given to the agent</div><pre>' + esc(ask || 'Test ' + (pr.title || '')) + '</pre>' +
      '<details data-key="prompt"' + (ui.open.has('prompt') ? ' open' : '') + '><summary>Show the full instructions (' + Math.round(d.prompt.length / 1000) + 'k characters)</summary><div class="full md">' + md(cut > -1 ? d.prompt.slice(0, cut) : d.prompt) + '</div></details></div>');
  }
  // Setup steps and agent activity on one timeline, in time order.
  const setup = setupSteps(d);
  // Entries without a time (the final "finished" event) take the time of the
  // entry before them, so they stay where they happened.
  let lastAt = null;
  const acts = d.activity.map((x) => { if (x.at) lastAt = x.at; return x.at ? x : { ...x, at: lastAt }; });
  const items = [...setup, ...acts].map((x, i) => ({ ...x, i })).sort((a, b) => (Date.parse(a.at || 0) - Date.parse(b.at || 0)) || (a.i - b.i))
    .filter((x) => !q || JSON.stringify(x).toLowerCase().includes(q));
  const lastSetup = setup.at(-1);
  let group = [];
  const flush = (nextAt) => {
    if (!group.length) return;
    const first = group[0], fails = group.filter((g) => g.status === 'error').length, pending = group.some((g) => g.status === 'pending');
    const dur = nextAt && first.at ? Date.parse(nextAt) - Date.parse(first.at) : null;
    const k = 'g' + first.at + group.length;
    out.push('<details class="grp" data-key="' + esc(k) + '"' + (ui.open.has(k) || q ? ' open' : '') + '><summary>' + (pending ? '<span class="spin"></span>' : I.chev) +
      (pending ? 'Running' : 'Ran') + ' ' + group.length + (group.length === 1 ? ' command' : ' commands') + (dur > 0 ? ' · ' + fmtDur(dur) : '') + (fails ? '<span class="fail">' + fails + ' failed</span>' : '') + '</summary><div class="rows">' +
      group.map((g) => '<details class="cmd"><summary><span class="st-' + g.status + '">' + ({ ok: '✓', error: '✗', pending: '·' }[g.status]) + '</span><span class="w">' + (g.mcp ? esc(g.mcp + ' · ' + g.tool + (g.what ? ': ' + g.what : '')) : esc(g.what || g.cmd.slice(0, 160) || g.tool)) + '</span><span class="tm">' + esc(clock(g.at)) + '</span></summary>' + (g.cmd ? '<pre>$ ' + esc(g.cmd) + '</pre>' : '') + (g.out ? '<pre>' + esc(g.out) + '</pre>' : '') + '</details>').join('') + '</div></details>');
    group = [];
  };
  const toolBlock = (g, n) => {
    const k = 'o' + (g.at || '') + n;
    const raw = g.out || '';
    const long = raw.split('\n').length > 4 || raw.length > 400;
    const icon = g.status === 'pending' ? '<span class="spin" style="margin-top:3px"></span>' : '<span class="st st-' + g.status + '">' + (g.status === 'error' ? '✗' : '●') + '</span>';
    // MCP output is JSON; show what a person would read (stdout, the detail).
    let out = g.out || '';
    if (g.mcp) { try { const j = JSON.parse(out); out = [j.stdout, j.stderr && 'stderr: ' + j.stderr, !j.stdout && j.detail, j.rows && JSON.stringify(j.rows, null, 1), j.url && 'url: ' + j.url, j.error].filter(Boolean).join('\n') || out; } catch { /* plain text */ } }
    g = { ...g, out };
    const name = g.mcp ? '<span class="mcp">' + esc(g.mcp) + '</span> · <b>' + esc(g.tool) + '</b>' : '<b>' + esc(g.tool) + '</b>';
    return '<div class="tool' + (g.status === 'error' ? ' error' : '') + '"><div class="head">' + icon + '<span>' + name + (g.mcp ? '' : ' <span class="what">' + esc(g.what || '') + '</span>') + '</span><span class="tm">' + esc(clock(g.at)) + '</span></div><div class="body">' +
      (g.mcp && g.what ? '<div class="args">' + esc(g.what) + '</div>' : '') +
      (g.cmd ? '<div class="cmdline">$ ' + esc(g.cmd) + '</div>' : '') +
      (g.out && g.out.trim() ? '<div class="outbox' + (ui.open.has(k) ? ' full' : '') + '" data-out="' + esc(k) + '"><pre>' + esc(g.out) + '</pre>' + (long ? '<button class="more" data-more="' + esc(k) + '">' + (ui.open.has(k) ? 'Show less' : 'Show all output') + '</button>' : '') + '</div>' : (g.status === 'pending' ? '<div class="cmdline">running…</div>' : '')) +
      '</div></div>';
  };
  items.forEach((a, n) => {
    if (a.kind === 'tool') { if (full) out.push(toolBlock(a, n)); else group.push(a); return; }
    flush(a.at);
    if (a.kind === 'setup') out.push('<div class="step setup"><span class="' + (a.bad ? 'st-error' : 'st-ok') + '">' + (a === lastSetup && running && !d.activity.length ? '<span class="spin"></span>' : a.bad ? '✗' : '✓') + '</span><span>' + esc(a.text) + '</span><span class="tm">' + esc(clock(a.at)) + '</span></div>');
    if (a.kind === 'phase') out.push('<div class="phase"><span class="n">' + a.n + '</span>' + esc(a.title) + '</div>');
    if (a.kind === 'say') out.push('<div class="say">' + md(a.text) + '</div>');
    if (a.kind === 'steer') out.push('<div class="steer-msg"><div class="who">' + esc(a.by) + ' · ' + esc(clock(a.at)) + '</div><div class="t">' + esc(a.text) + '</div></div>');
    if (a.kind === 'think') out.push('<details class="think"><summary>Thinking…</summary><div>' + esc(a.text) + '</div></details>');
    if (a.kind === 'end') out.push('<div class="done-line">Finished testing' + (d.usage ? ' after ' + fmtMin(d.usage.wallMs) : '') + '.</div>');
  });
  flush(null);
  for (const s of (d.steer || []).filter((x) => !x.delivered)) out.push('<div class="steer-msg wait"><div class="who">' + esc(s.by) + ' · ' + esc(clock(s.at)) + ' · waiting for the agent</div><div class="t">' + esc(s.text) + '</div></div>');
  if (running && !d.activity.length && setup.length) out.push('<div class="step setup"><span><span class="spin"></span></span><span>' + (setup.some((x) => /^Running /.test(x.text)) && !setup.some((x) => /finished/.test(x.text)) ? 'Waiting for the repo test suites before the agent starts' : 'Getting the agent ready') + '…</span><span class="tm"></span></div>');
  if (!items.length) out.push('<div class="say muted">' + (running ? 'Starting…' : 'Nothing was recorded for this run.') + '</div>');
  return out.join('');
}

// The fix of this run, newest first: running, pushed, or why nothing was pushed.
const FIX_STATE = { running: 'Fixing', pushed: 'Fix pushed', kept: 'Fix not pushed', nothing: 'Nothing fixed', moved: 'Not fixed: branch moved', refused: 'Not fixed', failed: 'Fix failed', stopped: 'Fix stopped' };
// What a fix is doing, from its last log line (bin/qa-fix).
function fixPhase(last) {
  const l = String(last || '');
  if (/finding\(s\) to fix|moved to/.test(l)) return 'Reading the report';
  if (/^checkout|beside it/.test(l)) return 'Code';
  if (/agent exit|replay/.test(l)) return 'Proving the fix on the site';
  if (/agent start|agent:/.test(l)) return 'Reproducing and fixing';
  if (/rexenv/.test(l)) return 'Fix site';

const canFix = (d) => d.status.state === 'done' && ['not_ok', 'partial'].includes(d.status.verdict);

  return canFix(d) ? '<button class="btn" data-act="fix" title="Miu fixes what this test found on the pull request\'s branch, then tests the new commit">' + (f ? 'Fix again' : 'Fix it') + '</button>' : '';
}
function fixCard(d) {

// A person's check of a finding: confirmed, or not a bug. Saved with the run

const BASE = { reproduced: 'Bug reproduced', not_reproduced: 'Could not reproduce', absent_before: 'Not there before', same_before: 'Same on dev', not_applicable: 'Nothing to compare', unverified: 'Not verified' };

    (c.results.filter((r) => r.note).map((r) => '<div class="note">' + esc(r.env) + ': ' + esc(r.note) + '</div>').join('')) + proof(c.evidence, by) + '</div>';

  return '<div class="ba">' + before + after + '</div>';
}

// Every run of this pull request, newest first: switch rounds from the top bar.
function runPicker(d) {

  const label = (r, i) => 'Run ' + (n - i) + ' of ' + n + ', ' + (r.state === 'running' ? 'running' : r.verdict ? VERDICT[r.verdict] : STATE[r.state] || r.state) + ', ' + when(r.mtime);

function runTab(d) {

// Dialog in place of confirm() and alert(): ask() resolves true or false,
// tell() just informs. Escape cancels, Enter confirms.
function ask({ title, body = '', ok = 'OK', cancel = 'Cancel', danger = false, single = false }) {
  return new Promise((resolve) => {
    const d = $('#dlg'), yes = $('#dlgYes'), no = $('#dlgNo'), before = document.activeElement;
    $('#dlgT').textContent = title; $('#dlgB').textContent = body; $('#dlgB').hidden = !body;
    yes.textContent = ok; no.textContent = cancel; no.hidden = single;
    yes.classList.toggle('danger', danger);
    d.hidden = false;
    (danger && !single ? no : yes).focus();
    const done = (v) => { d.hidden = true; d.removeEventListener('keydown', key); yes.onclick = no.onclick = d.onclick = null; before?.focus?.(); resolve(v); };
    const key = (e) => {
      if (e.key === 'Escape') { e.preventDefault(); done(false); }
      else if (e.key === 'Tab') { e.preventDefault(); (document.activeElement === yes && !single ? no : yes).focus(); }
    };
    d.addEventListener('keydown', key);
    yes.onclick = () => done(true); no.onclick = () => done(false);
    d.onclick = (e) => { if (e.target === d) done(false); };

}
const tell = (title, body) => ask({ title, body, ok: 'OK', single: true });

  if (save) store.set('qa-pw', ui.pw);
}
document.addEventListener('pointerdown', (e) => {
  const bar = e.target.closest?.('.splitter');
  if (!bar) return;
  e.preventDefault();
  const work = bar.closest('.work');
  work.classList.add('resizing');
  bar.setPointerCapture(e.pointerId);
  const move = (ev) => { const r = work.getBoundingClientRect(); setPanelWidth(((r.right - ev.clientX) / r.width) * 100, false); };
  const up = () => { work.classList.remove('resizing'); bar.removeEventListener('pointermove', move); bar.removeEventListener('pointerup', up); bar.removeEventListener('pointercancel', up); setPanelWidth(ui.pw, true); };
  bar.addEventListener('pointermove', move);
  bar.addEventListener('pointerup', up);
  bar.addEventListener('pointercancel', up);
});
document.addEventListener('dblclick', (e) => { if (e.target.closest?.('.splitter')) setPanelWidth(50, true); });
document.addEventListener('keydown', (e) => {
  if (!e.target.classList?.contains('splitter')) return;
  const step = e.shiftKey ? 10 : 2;
  const to = { ArrowLeft: ui.pw + step, ArrowRight: ui.pw - step, Home: 75, End: 25 }[e.key];
  if (to != null) { setPanelWidth(to, true); e.preventDefault(); }
});

// Filters: a link with query parameters wins; otherwise the last ones used here.
if (location.search) ui.f = readUrl();
else { const saved = store.get('qa-f', null); ui.f = { q: '', author: [], label: [], result: [], sort: 'updated', ...(saved && typeof saved === 'object' ? saved : {}) }; }

// Who is signed in (when sign-in is on).
fetch('/api/me').then((r) => r.json()).then((m) => {
  ui.admin = m.admin !== false; ui.me = m.user ? { ...m.user, role: m.role } : null; ui.authOn = !!m.auth; ui.key = '';
  if (!m.user) return;
  $('#me').innerHTML = userAv(m.user) + '<span title="' + esc(m.user.login + ', ' + m.role) + '">' + esc(m.user.name || m.user.login) + '</span><button data-act="logout">Sign out</button>';
}).catch(() => {});
document.addEventListener('click', async (e) => {
  if (!e.target.closest?.('[data-act=logout]')) return;
  await post('/auth/logout'); location.href = '/';
});

async function tick() {
  // Only a tick that began after the last click may end its loading bar.
  const seq = ui.navSeq;
  try {
    const needPrs = !ui.prs || Date.now() - lastPrs > 15000;
    const [runs, opts, prs] = await Promise.all([fetch('/api/runs').then((r) => r.json()), ui.models.length ? null : fetch('/api/options').then((r) => r.json()), needPrs ? fetch('/api/prs').then((r) => r.json()) : null]);
    ui.runs = runs;
    if (opts) { ui.models = opts.models; ui.efforts = opts.efforts || []; }
    if (prs) { ui.prs = prs; lastPrs = Date.now(); }
    renderSide();
    notifyFinished(runs);
    if (route() === 'stats') await renderStats(); else if (isSettings()) renderSettings(); else if (route().startsWith('pr/')) await renderPrPage(); else if (route()) await renderRun(); else renderPrs();
  } catch (err) { console.error(err); }
  if (seq === ui.navSeq) loadDone();
}
tick();
setInterval(tick, 3000);
</script>
</body>
</html>
